<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#09090f" />
  <meta name="description" content="SQ AI — Create videos, images, content and advertising campaigns with AI." />
  <title>SQ AI — AI Creative Studio</title>

  <style>
    :root {
      --bg: #08090d;
      --bg-soft: #0d0f16;
      --panel: #11131b;
      --panel-2: #151824;
      --border: rgba(255,255,255,.08);
      --border-strong: rgba(255,255,255,.14);
      --text: #f5f7fb;
      --muted: #969cab;
      --primary: #7c5cff;
      --primary-2: #5b8cff;
      --success: #35d07f;
      --danger: #ff5d6c;
      --warning: #ffbd5a;
      --radius: 18px;
      --shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 0%, rgba(124,92,255,.13), transparent 30%),
        radial-gradient(circle at 90% 10%, rgba(91,140,255,.09), transparent 28%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .hidden {
      display: none !important;
    }

    .container {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
    }

    /* =========================
       LANDING
    ========================= */

    .landing {
      min-height: 100vh;
    }

    .landing-header {
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid var(--border);
      background: rgba(8,9,13,.78);
      backdrop-filter: blur(20px);
    }

    .landing-nav {
      min-height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      font-weight: 800;
      letter-spacing: -.03em;
    }

    .brand-mark {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      box-shadow: 0 8px 30px rgba(124,92,255,.3);
      font-weight: 900;
    }

    .brand-name {
      font-size: 20px;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn {
      min-height: 44px;
      padding: 0 17px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      transition: .2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: var(--border-strong);
      background: var(--panel-2);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      border-color: transparent;
      box-shadow: 0 10px 30px rgba(124,92,255,.22);
    }

    .btn-primary:hover {
      filter: brightness(1.08);
    }

    .btn-danger {
      color: #fff;
      background: rgba(255,93,108,.12);
      border-color: rgba(255,93,108,.2);
    }

    .hero {
      padding: 100px 0 70px;
      text-align: center;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 13px;
      border: 1px solid rgba(124,92,255,.25);
      background: rgba(124,92,255,.09);
      border-radius: 999px;
      color: #cfc6ff;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .hero h1 {
      max-width: 850px;
      margin: 0 auto;
      font-size: clamp(44px, 7vw, 78px);
      line-height: .98;
      letter-spacing: -.065em;
    }

    .hero h1 span {
      background: linear-gradient(90deg, #fff, #9d8cff, #7ca9ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero p {
      max-width: 680px;
      margin: 28px auto 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
    }

    .hero-actions {
      margin-top: 32px;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .landing-tools {
      padding: 50px 0 100px;
    }

    .section-title {
      text-align: center;
      margin-bottom: 28px;
    }

    .section-title h2 {
      font-size: 30px;
      letter-spacing: -.04em;
    }

    .section-title p {
      color: var(--muted);
      margin-top: 8px;
    }

    .landing-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .landing-card {
      padding: 25px;
      min-height: 210px;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.015));
      border-radius: 20px;
      transition: .25s ease;
    }

    .landing-card:hover {
      transform: translateY(-5px);
      border-color: rgba(124,92,255,.3);
      box-shadow: var(--shadow);
    }

    .landing-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: rgba(124,92,255,.12);
      margin-bottom: 20px;
      font-size: 22px;
    }

    .landing-card h3 {
      font-size: 18px;
      margin-bottom: 8px;
    }

    .landing-card p {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .landing-footer {
      border-top: 1px solid var(--border);
      padding: 30px 0;
      color: var(--muted);
      font-size: 13px;
    }

    /* =========================
       AUTH MODAL
    ========================= */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0,0,0,.7);
      backdrop-filter: blur(10px);
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .modal {
      width: min(440px, 100%);
      background: var(--panel);
      border: 1px solid var(--border-strong);
      border-radius: 22px;
      box-shadow: var(--shadow);
      padding: 28px;
    }

    .modal-head {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-start;
      margin-bottom: 24px;
    }

    .modal-head h2 {
      font-size: 25px;
    }

    .modal-head p {
      color: var(--muted);
      margin-top: 6px;
      font-size: 13px;
    }

    .close-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(255,255,255,.05);
      color: var(--muted);
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      color: #c5c8d2;
    }

    .input,
    .textarea,
    .select {
      width: 100%;
      border: 1px solid var(--border);
      background: #0b0d13;
      color: var(--text);
      border-radius: 12px;
      outline: none;
      padding: 13px 14px;
      transition: .2s;
    }

    .input:focus,
    .textarea:focus,
    .select:focus {
      border-color: rgba(124,92,255,.65);
      box-shadow: 0 0 0 3px rgba(124,92,255,.1);
    }

    .textarea {
      min-height: 150px;
      resize: vertical;
      line-height: 1.6;
    }

    .auth-submit {
      width: 100%;
      margin-top: 5px;
    }

    .auth-switch {
      margin-top: 18px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    .auth-switch button {
      background: none;
      color: #a999ff;
      margin-left: 4px;
    }

    .error-box {
      padding: 11px 13px;
      border-radius: 10px;
      background: rgba(255,93,108,.1);
      border: 1px solid rgba(255,93,108,.18);
      color: #ff9da7;
      font-size: 13px;
      margin-bottom: 14px;
    }

    /* =========================
       APP
    ========================= */

    .app {
      min-height: 100vh;
      display: flex;
    }

    .sidebar {
      width: 255px;
      flex: 0 0 255px;
      height: 100vh;
      position: sticky;
      top: 0;
      border-right: 1px solid var(--border);
      background: rgba(9,10,15,.92);
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .sidebar-brand {
      padding: 4px 8px 22px;
    }

    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-label {
      color: #666b79;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .12em;
      padding: 18px 10px 7px;
    }

    .side-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 12px;
      border-radius: 11px;
      background: transparent;
      color: #9b9fab;
      text-align: left;
      transition: .2s;
    }

    .side-btn:hover {
      color: var(--text);
      background: rgba(255,255,255,.04);
    }

    .side-btn.active {
      color: #fff;
      background: rgba(124,92,255,.14);
      border: 1px solid rgba(124,92,255,.14);
    }

    .side-icon {
      width: 20px;
      text-align: center;
    }

    .sidebar-bottom {
      margin-top: auto;
      padding-top: 18px;
    }

    .credits-box {
      padding: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.025);
      border-radius: 15px;
    }

    .credits
